<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++++
@@ T.P Magazine HOME / TrendyPicker
- Path: [skin]/main/magazine.html
- URL: /main/magazine
- Content loads from /board/?id=magazine&iframe=1
++++++++++++++++++++++++++++++++++++++++++++++++++++ -->

<link rel="stylesheet" href="/data/skin/{skin}/css/redesign/trendypicker-magazine.css" />
<style>
body.is-magazine-page,
body:has(.magazine-main),
body.is-magazine-page #layout_wrap,
body.is-magazine-page #layout_body,
body:has(.magazine-main) #layout_wrap,
body:has(.magazine-main) #layout_body {
	width: 100%;
	max-width: none;
	min-width: 0;
	margin: 0;
	padding-left: 0;
	padding-right: 0;
	background: #202020;
	overflow-x: hidden;
	overflow-y: auto;
}
.magazine-main {
	box-sizing: border-box;
	display: flex;
	flex-direction: column;
	align-items: center;
	width: 100vw;
	max-width: 100vw;
	margin: 0;
	margin-left: calc(50% - 50vw);
	padding: 0;
	float: none;
	clear: both;
	background: #202020;
}
.magazine-shell {
	box-sizing: border-box;
	width: min(1350px, calc(100vw - 80px));
	max-width: 100%;
	height: auto !important;
	min-height: 0 !important;
	margin-top: clamp(-65px, -3.8vw, -43px);
	margin-right: auto;
	margin-bottom: 0;
	margin-left: auto;
	padding: clamp(34px, 3.2vw, 61px) !important;
}
@media (max-width: 1120px) {
	body.is-magazine-page #layout_wrap,
	body.is-magazine-page #layout_body,
	body:has(.magazine-main) #layout_wrap,
	body:has(.magazine-main) #layout_body {
		width: 100% !important;
		max-width: 100% !important;
		margin-left: 0 !important;
		margin-right: 0 !important;
		padding-left: 0 !important;
		padding-right: 0 !important;
	}
	.magazine-main {
		align-items: stretch !important;
		width: 100% !important;
		max-width: 100% !important;
		margin-left: 0 !important;
		margin-right: 0 !important;
	}
	.magazine-shell {
		align-self: stretch !important;
		width: 100% !important;
		max-width: 100% !important;
		margin-right: 0 !important;
		margin-left: 0 !important;
		padding-left: clamp(20px, 4vw, 40px) !important;
		padding-right: clamp(20px, 4vw, 40px) !important;
	}
}
@media (max-width: 760px) {
	.magazine-shell {
		width: 100% !important;
		max-width: 100% !important;
		margin-left: 0 !important;
		margin-right: 0 !important;
		padding-left: 14px !important;
		padding-right: 14px !important;
	}
}
.magazine-frame {
	height: auto;
	max-height: none;
}
</style>

<main class="magazine-main">
	<section class="magazine-hero" aria-labelledby="magazine-title">
		<div class="magazine-hero-copy">
			<p>TrendyPicker Editorial</p>
			<h1 id="magazine-title">T.P Magazine</h1>
			<span>Trend stories, shopping guides, and editor notes from Korea.</span>
		</div>
	</section>

	<section class="magazine-shell" aria-label="Magazine posts">
		<nav class="magazine-breadcrumb" aria-label="Breadcrumb">
			<a href="/main">Home</a>
			<span aria-hidden="true">&gt;</span>
			<span>T.P Magazine</span>
		</nav>

		<!--{? categorylist}-->
		<nav class="magazine-topic-tabs" aria-label="Magazine categories">
			<a class="is-active" href="/main/magazine">Home</a>
			<!--{@ categorylist}-->
			<a href="/board/?id=magazine&amp;category={=str_replace('&','%26',.value_)}&amp;perpage=12">{.value_}</a>
			<!--{/}-->
		</nav>
		<!--{/}-->

		<iframe
			name="magazine_home_frame"
			id="magazine_home_frame"
			class="magazine-frame"
			src="/board/?id=magazine&amp;iframe=1&amp;perpage=100"
			data-list-src="/board/?id=magazine&amp;iframe=1&amp;perpage=100"
			width="100%"
			height="600"
			frameborder="0"
			scrolling="no"
			allowTransparency="true"
			title="T.P Magazine posts"
		></iframe>

		<section class="newsletter editors-newsletter magazine-newsletter" aria-labelledby="magazine-newsletter-title">
			<div>
				<h2 id="magazine-newsletter-title">Be the first to know</h2>
				<p>Get trend updates, exclusive offers, and more!</p>
			</div>
			<form action="/member_process/newsletter" method="post">
				<label class="bo-magazine-sr" for="magazine-newsletter-email">Email</label>
				<input id="magazine-newsletter-email" name="email" type="email" placeholder="Enter Your Email" />
				<button type="submit">SUBSCRIBE</button>
			</form>
		</section>
	</section>
</main>

<script src="/app/javascript/js/trendypicker-magazine.js"></script>
<script>
document.body.className += (document.body.className ? " " : "") + "is-magazine-page";
</script>
