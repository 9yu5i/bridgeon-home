<script type="text/javascript">
$(document).ready(function(){
    <!--{? manager.id != 'magazine' && manager.id != 'promotion' && manager.id != 'editors' && manager.id != 'notice' && manager.id != 'faq' && manager.id != 'mbqna' && _GET.id != 'notice' && _GET.id != 'faq' && _GET.id != 'mbqna'}-->
    if($(window).width() < 1023 && $("#subpageLNB #boardLnbCommon").length > 0){
        $("#bbslist").before($("#boardLnbCommon"));
    }
    $(window).resize(function(){
        if($(window).width() < 1023 && $("#subpageLNB #boardLnbCommon").length > 0){
            $("#bbslist").before($("#boardLnbCommon"));
        } else if ($(window).width() > 1023 && $(".subpage_container #boardLnbCommon").length > 0){
            $("#subpageLNB").prepend($("#boardLnbCommon"));
        }
    });
    if($('.subpage_container .lnb_sub').length > 0){
        $('.subpage_container .lnb_sub').after().on("click", function (event) {
            $(".lnb_sub").toggleClass("on");
            var top = $(".lnb_sub").offset().top + $(".lnb_sub").outerHeight();
            $(".board_mo_menu_bg").css("top",top+"px");
            $(".board_mo_menu_bg").toggle();
        });
    }
    <!--{/}-->
    <!--{? manager.id == 'magazine' }-->
    if ( window.innerWidth < 1024 && $(".category_event").length > 0 ) {
        $('.category_event ul > li').addClass('swiper-slide');
        slideshowSwiper = new Swiper('.category_event', {
            wrapperClass: 'board_category',
            slidesPerView: 'auto'
        });
    }
    <!--{/}-->
    $('.boad_view_btn').live('click', function(event) {
        if (event && event.preventDefault) event.preventDefault();
        if (event && event.stopPropagation) event.stopPropagation();
        var viewlink = $(this).attr('viewlink');
        var board_seq = $(this).attr('board_seq');
        var viewtype = $(this).attr('viewtype');
        var pagetype = $(this).attr('pagetype');
        if(viewtype == 'layer' && (pagetype == 'goods' || pagetype == 'mypage') ){
            boardviewtype(viewlink,board_seq,viewtype);
        }else{
            var targetUrl = viewlink || '';
            try {
                var parsed = new URL(viewlink, window.location.origin);
                parsed.searchParams.delete('iframe');
                parsed.searchParams.delete('popup');
                targetUrl = parsed.pathname + parsed.search + parsed.hash;
            } catch (e) {
                targetUrl = String(viewlink || '')
                    .replace(/([?&])iframe=1(?=&|$)/g, '$1')
                    .replace(/([?&])popup=1(?=&|$)/g, '$1')
                    .replace(/[?&]$/, '')
                    .replace(/\?&/, '?');
            }
            if ( self !== top ) {
                window.top.location.assign(targetUrl);
            } else {
                document.location.assign(targetUrl);
            }

        }
    });
});
