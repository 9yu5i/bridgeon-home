<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++++
@@ "검색결과" 리스트 페이지 @@
- 파일위치 : [스킨폴더]/goods/search.html
++++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<link rel="stylesheet" href="../css/redesign/trendypicker-listing-cards.css" />
<link rel="stylesheet" href="../css/redesign/trendypicker-catalog.css" />
<style>
.layout_header .resp_top_search {height:initial;}

body.is-catalog-page .search_nav,
body.is-catalog-page .title_container,
body.is-catalog-page .structure_nav,
body.is-catalog-page #subpageLNB,
body.is-catalog-page #subAllButton,
body.is-catalog-page .filtered_item_sorting {
	display: none !important;
}

.listing-search-head {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 10px;
  margin-bottom: 28px;
}

.listing-search-label {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin: 0;
  padding: 7px 14px;
  border-radius: 999px;
  color: var(--purple);
  background: rgba(123, 63, 228, 0.1);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.listing-search-query {
  position: relative;
  margin: 0;
  max-width: min(100%, 18em);
  color: var(--ink);
  font-size: clamp(28px, 6.2vw, 46px);
  line-height: 1.08;
  font-weight: 800;
  letter-spacing: -0.035em;
  word-break: break-word;
}

.listing-search-query::after {
  content: "";
  display: block;
  width: 42px;
  height: 3px;
  margin: 16px auto 0;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--purple) 0%, #c9b0ff 100%);
}

@media (min-width: 761px) {
  .listing-search-head {
    margin-bottom: 42px;
    gap: 16px;
  }

  .listing-search-label {
    padding: 8px 16px;
    font-size: 12px;
  }

  .listing-search-query::after {
    width: 52px;
    margin-top: 18px;
  }
}

.listing-page--search .listing-hero {
  background: radial-gradient(circle at 18% 24%, rgba(255, 255, 255, 0.7) 0 5%, transparent 18%), radial-gradient(circle at 84% 18%, rgba(255, 255, 255, 0.42) 0 4%, transparent 16%), linear-gradient(
180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.02)), linear-gradient(
135deg, #cbb6ff 0%, #e4d7ff 48%, #f2efff 100%);
}

.listing-hero-inner {
    display: grid;
    place-content: center;
    min-height: var(--listing-hero-inner-height);
    padding: 28px 20px;
    text-align: center;
    box-sizing: border-box;
}
</style>
<script>
document.documentElement.className += (document.documentElement.className ? " " : "") + "is-catalog-page";
if (document.body) {
	document.body.className += (document.body.className ? " " : "") + "is-catalog-page";
}
</script>

<div id="itemstmplayer" class="hide"></div>

<main class="bo-catalog-main listing-main listing-page--search" id="search_result_page">
	<section class="bo-catalog-hero listing-hero listing-hero--search" aria-label="Search hero"></section>

	<div class="bo-catalog-shell">
		<nav class="bo-catalog-breadcrumbs" aria-label="Breadcrumb">
			<a href="/main">Home</a>
			<span aria-hidden="true">&gt;</span>
			<!--{ ? goodsSearchText }-->
			<span>Search results</span>
			<!--{ : }-->
			<!--{ ? tag }-->
			<span>Tag: {tag}</span>
			<!--{ : }-->
			<span>Search</span>
			<!--{ / }-->
			<!--{ / }-->
		</nav>

		<!--{ ? goodsSearchText }-->
		<div class="listing-search-head">
			<p class="listing-search-label" designElement="text">Search results</p>
			<h1 class="listing-search-query" data-search-query>{goodsSearchText}</h1>
		</div>
		<!--{ : }-->
		<!--{ ? tag }-->
		<div class="listing-search-head">
			<p class="listing-search-label">Tag search</p>
			<h1 class="listing-search-query" data-search-query>{tag}</h1>
		</div>
		<!--{ : }-->
		<div class="listing-search-head">
			<p class="listing-search-label" designElement="text">Search results</p>
			<h1 class="listing-search-query" data-search-query><span designElement="text">Search</span></h1>
		</div>
		<!--{ / }-->
		<!--{ / }-->

		<div class="bo-catalog-layout listing-layout">
			<aside class="bo-catalog-filters listing-filters search_left" aria-label="Product filters">
				<div class="catalog_mo">
					<span class="filter_title">FILTER<a href="#"><img src="../images/icon/icon-delete.png" alt=""></a></span>
				</div>
				{=showGoodsSearchFormLight()}
				<div class="fixed_bottom">
					<a href="#" onclick="resetParams();" class="selected_clear">Clear All</a>
					<button class="btn_resp size_d color2">Show Results</button>
				</div>
			</aside>

			<section class="bo-catalog-results listing-results catalog_right" aria-label="Product results">
				<div class="bo-catalog-toolbar listing-toolbar">
					<p class="bo-catalog-count">
						<span class="bo-catalog-count-desktop">Results </span>
						<strong data-catalog-count>({=number_format(totcount)})</strong>
						<span class="bo-catalog-count-mobile" data-catalog-count-mobile>
							{=number_format(totcount)} Items
						</span>
					</p>
					<div class="bo-catalog-toolbar-actions">
						<label class="bo-catalog-sort">
							<span class="bo-catalog-sr">Sort products</span>
							<select class="filter_select" id="catalog_filter" aria-label="Sort products">
								<option value="ranking">Best Selling</option>
								<option value="regist">Newest</option>
								<option value="low_price">Price: Low to High</option>
								<option value="high_price">Price: High to Low</option>
								<option value="review">Top Rated</option>
								<option value="sale">Sale</option>
							</select>
						</label>
						<button type="button" class="listing-filter-open mobile-only" data-listing-filter-open aria-controls="listing-filters" aria-expanded="false">
							<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4" /></svg>
							<span class="sr-only">Open filters</span>
						</button>
					</div>
				</div>

				<div class="listing-active-filters" id="listingActiveFilters" hidden>
					<div class="listing-chips" id="listingChips" role="list"></div>
					<button type="button" class="listing-clear-all desktop-only" data-listing-clear-filters onclick="resetParams();">Clear all</button>
				</div>

				<div class="catalog_mo">
					<div class="catalog_filter"></div>
				</div>

				<div
					id="searchedItemDisplay"
					class="searched_item_display bo-catalog-grid tp-listing-grid"
					data-displaytype="lattice"
				></div>
			</section>
		</div>
	</div>
</main>

<div id="wish_alert">
	<div class="wa_on"></div>
	<div class="wa_off"></div>
	<div class="wa_msg"></div>
</div>

<script src="/app/javascript/js/trendypicker-listing-cards.js"></script>
<script src="/app/javascript/js/trendypicker-catalog.js?v=20260903-3"></script>
<script type="text/javascript">
$(function () {
	var tag = "{tag}";
	// 검색 페이지 -> 디폴트 검색박스 open
	if (!tag) {
		$('.search_ver2').addClass('on');
	}

	colorFilter_white("#searchFilterSelected .color_type");

	$("#catalog_filter").on("change", function () {
		var sort = $(this).val();
		$("#filteredItemSorting li.item_order ul.list li label input").each(function () {
			if ($(this).val() == sort) {
				$(this).click();
			}
		});
	});

	$(document).on("click", ".catalog_filter .selected_item_area a.remove", function () {
		var fi = $(this).parent().data("filteritem");
		$("#searchFilterSelected .selected_item_area li").each(function () {
			if (fi == $(this).data("filteritem")) {
				$(this).find("a.remove").click();
			}
		});
	});

	$(document).on("click", ".catalog_category, .catalog_filter", function () {
		$(".catalog_filter > ul").remove();
		$(".catalog_filter").append($(".search_filter_selected .selected_item_area").clone());
	});

	$(".category_filter_mo").on("click", function () {
		$(".search_left").addClass("on");
	});
	$("#search_result_page .filter_title a, .fixed_bottom > button").on("click", function () {
		$(".search_left").removeClass("on");
	});

	// 모바일 필터 재생성
	window.setTimeout(function () {
		$(".catalog_category").append($(".filter_category_section .filter_detail_item").clone());
		if (window.innerWidth < 1024 && $("#search_result_page .catalog_category").length > 0) {
			$("#search_result_page .catalog_category ul > li").addClass("swiper-slide");
			slideshowSwiper = new Swiper("#search_result_page .catalog_category", {
				wrapperClass: "filter_detail_item",
				slidesPerView: "auto"
			});
		}
		$(".catalog_filter").append($(".search_filter_selected .selected_item_area").clone());
	}, 1000);
});
</script>
