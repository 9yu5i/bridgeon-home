- 파일위치 : [스킨폴더]/goods/brand_main.html
- 디자인 목업은 글자 목록형(letter-grouped) 레이아웃이라, 원본의 이미지 기반
  "ALL 탭 + 알파벳 탭 전환" 방식 대신 실제 brandMenuData(글자별 그룹)를
  그대로 이어서 보여주는 방식으로 구성. 알파벳 버튼은 각 그룹으로 점프하는
  실제 앵커 링크. 검색은 타이핑하는 즉시 클라이언트 단에서 브랜드명 매칭 필터링.

<link rel="stylesheet" href="/data/skin/{skin}/css/redesign/trendypicker-brand.css" />
<script>
document.documentElement.className += (document.documentElement.className ? " " : "") + "is-brand-page";
if (document.body) document.body.className += (document.body.className ? " " : "") + "is-brand-page";
</script>

<!-- 브랜드 데이터 로드 -->
<!--{=assignBrandMenuData()}-->

<div class="bo-brand-shell">
	<nav class="bo-brand-breadcrumbs" aria-label="Breadcrumb">
		<a href="/main">Home</a>
		<span aria-hidden="true">&gt;</span>
		<span>All Brands</span>
	</nav>

	<h1 class="bo-brand-title">All Brands</h1>

	<!--{ ? brandMenuData }-->
	<div class="bo-brand-toolbar">
		<div class="bo-brand-alpha" role="tablist" aria-label="Jump to letter">
			<!--{ @ (brandMenuData) }-->
			<!--{ ? !preg_match("/[ㄱ-힣]/u", .key_) }-->
			<!--{ ? .value_[0] }-->
			<a class="bo-brand-alpha-button" role="tab" href="#bo-brand-group-{=str_replace("/", "", strtr(base64_encode(str_replace("/", "", .key_)), "+=", "-_"))}"><!--{ ? strtoupper(.key_) == 'OTHER' }-->#<!--{ : }-->{=strtoupper(.key_)}<!--{ / }--></a>
			<!--{ : }-->
			<span class="bo-brand-alpha-button bo-brand-alpha-button--empty" aria-disabled="true"><!--{ ? strtoupper(.key_) == 'OTHER' }-->#<!--{ : }-->{=strtoupper(.key_)}<!--{ / }--></span>
			<!--{ / }-->
			<!--{ / }-->
			<!--{ / }-->
		</div>
		<form id="brandFm" class="bo-brand-search" role="search">
			<label class="sr-only" for="bo-brand-search-input">Search brands</label>
			<input id="bo-brand-search-input" type="text" name="keyword" class="search_input" placeholder="Search Brands" autocomplete="off" />
		</form>
	</div>

	<div class="bo-brand-directory" data-brand-directory>
		<!--{ @ (brandMenuData) }-->
		<!--{ ? !preg_match("/[ㄱ-힣]/u", .key_) }-->
		<section class="bo-brand-group" id="bo-brand-group-{=str_replace("/", "", strtr(base64_encode(str_replace("/", "", .key_)), "+=", "-_"))}">
			<h2 class="bo-brand-group-letter"><!--{ ? strtoupper(.key_) == 'OTHER' }-->#<!--{ : }-->{=strtoupper(.key_)}<!--{ / }--></h2>
			<ul class="bo-brand-group-list">
				<!--{ @ .value_ }-->
				<li>
					<a href="/goods/brand?code={..category_code}" data-brand-code="{..category_code}">
						{..prn_title}
						<!--{ ? ..best == 'Y' }-->
						<span class="bo-brand-best-badge" aria-hidden="true">B</span>
						<!--{ / }-->
					</a>
				</li>
				<!--{ / }-->
			</ul>
		</section>
		<!--{ / }-->
		<!--{ / }-->
	</div>
	<p class="bo-brand-empty" id="bo-brand-filter-empty" hidden>No brands found.</p>
	<!--{ : }-->
	<div class="no_data_area2">
		No brand information available.
	</div>
	<!--{ / }-->
</div>

<script type="text/javascript">
$(document).ready(function() {
	// 브랜드 데이터가 같은 category_code를 이름만 다르게 중복으로 내려주는 경우가 있어
	// (예: Dr.Althea / Dr. Althea) 같은 code는 하나만 남기고 나머지 li를 제거한다.
	// 남길 후보는 "제대로 표기된 이름"을 우선: 띄어쓰기 많음 > 대문자 많음 > 길이 긴 것.
	function dedupeBrands() {
		function countMatches(str, re) {
			var m = String(str).match(re);
			return m ? m.length : 0;
		}
		function betterName(a, b) {
			// b가 a보다 나은 이름이면 true
			var sa = countMatches(a, /\s/g), sb = countMatches(b, /\s/g);
			if (sb !== sa) return sb > sa;
			var ua = countMatches(a, /[A-Z]/g), ub = countMatches(b, /[A-Z]/g);
			if (ub !== ua) return ub > ua;
			return b.length > a.length;
		}
		var kept = {}; // code -> 남겨둔 a element
		$(".bo-brand-directory a[data-brand-code]").each(function() {
			var $a = $(this);
			var code = $a.attr("data-brand-code");
			if (!code) return;
			var name = $.trim($a.text());
			if (!kept[code]) {
				kept[code] = { a: this, name: name };
				return;
			}
			// 이미 같은 code가 있으면 더 나은 이름 쪽만 남기고 다른 li를 제거
			if (betterName(kept[code].name, name)) {
				$(kept[code].a).closest("li").remove();
				kept[code] = { a: this, name: name };
			} else {
				$a.closest("li").remove();
			}
		});
	}
	dedupeBrands();

	function filterBrands(keyword) {
		var kw = $.trim(keyword).toLowerCase();
		var anyVisible = false;
		$(".bo-brand-group").each(function() {
			var $group = $(this);
			var groupHasMatch = false;
			$group.find(".bo-brand-group-list a[data-brand-code]").each(function() {
				var show = !kw || $(this).text().toLowerCase().indexOf(kw) > -1;
				$(this).parent("li").toggle(show);
				if (show) groupHasMatch = true;
			});
			$group.toggle(groupHasMatch);
			if (groupHasMatch) anyVisible = true;
		});
		$("#bo-brand-filter-empty").prop("hidden", anyVisible);
	}

	$("#bo-brand-search-input").on("input", function() {
		filterBrands($(this).val());
	});

	$("#brandFm").submit(function() {
		filterBrands($("#bo-brand-search-input").val());
		return false;
	});
});
</script>
