<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++++
@@ Category catalog / TrendyPicker
- Path: [skin]/goods/catalog.html
- URL: /goods/catalog
- Design: listing/beauty.html
++++++++++++++++++++++++++++++++++++++++++++++++++++ -->
<link rel="stylesheet" href="/data/skin/{=skin}/css/redesign/trendypicker-listing-cards.css" />
<link rel="stylesheet" href="/data/skin/{=skin}/css/redesign/trendypicker-catalog.css?v=20260904-1" />
<style>
body.is-catalog-page .search_nav,
body.is-catalog-page .title_container,
body.is-catalog-page .structure_nav,
body.is-catalog-page #subpageLNB,
body.is-catalog-page #subAllButton,
body.is-catalog-page .filtered_item_sorting {
	display: none !important;
}
</style>
<script>
document.documentElement.className += (document.documentElement.className ? " " : "") + "is-catalog-page";
if (document.body) {
	document.body.className += (document.body.className ? " " : "") + "is-catalog-page";
}
</script>

<div id="itemstmplayer" class="hide"></div>

<main class="bo-catalog-main listing-main" id="catalog_page" data-category-title="{categoryData.title}">
	<section class="bo-catalog-hero" aria-label="Category promotion">
		<div class="bo-catalog-hero-inner">
			<p class="bo-catalog-hero-kicker" data-catalog-kicker>Shop by category</p>
			<h1 class="bo-catalog-hero-title">{categoryData.title}</h1>
		</div>
	</section>

	<div class="bo-catalog-shell">
		<nav class="bo-catalog-breadcrumbs" aria-label="Breadcrumb">
			<a href="/main">Home</a>
			<span aria-hidden="true">&gt;</span>
			<span>{categoryData.title}</span>
		</nav>

		<div class="bo-catalog-layout listing-layout">
			<aside class="bo-catalog-filters listing-filters search_left" aria-label="Product filters">
				<div class="catalog_mo">
					<span class="filter_title">FILTER<a href="#"><img src="../images/icon/icon-delete.png" alt=""></a></span>
				</div>
				{=showGoodsSearchFormLight()}
				<div class="fixed_bottom">
					<a href="#" onclick="resetParams();" class="selected_clear">Clear All</a>
					<button class="btn_resp size_d color2">Show Results</button>
				</div>
			</aside>

			<section class="bo-catalog-results listing-results catalog_right" aria-label="Product results">
				<!--{ ? categoryData.top_html }-->
				<div class="category_edit_area mobile_img_adjust">
					{categoryData.top_html}
				</div>
				<!--{ / }-->

				<div class="bo-catalog-toolbar listing-toolbar">
					<p class="bo-catalog-count">
						<span class="bo-catalog-count-desktop">All Products </span>
						<strong data-catalog-count>({=number_format(totcount)})</strong>
						<span class="bo-catalog-count-mobile" data-catalog-count-mobile>
							{=number_format(totcount)} Items
						</span>
					</p>
					<div class="bo-catalog-toolbar-actions">
						<label class="bo-catalog-sort">
							<span class="bo-catalog-sr">Sort products</span>
							<select class="filter_select" id="catalog_filter" aria-label="Sort products">
								<option value="ranking">Best Selling</option>
								<option value="regist">Newest</option>
								<option value="low_price">Price: Low to High</option>
								<option value="high_price">Price: High to Low</option>
								<option value="review">Top Rated</option>
								<option value="sale">Sale</option>
							</select>
						</label>
						<button type="button" class="listing-filter-open mobile-only" data-listing-filter-open aria-controls="listing-filters" aria-expanded="false">
							<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4" /></svg>
							<span class="sr-only">Open filters</span>
						</button>
					</div>
				</div>

				<div class="listing-active-filters" id="listingActiveFilters" hidden>
					<div class="listing-chips" id="listingChips" role="list"></div>
					<button type="button" class="listing-clear-all desktop-only" data-listing-clear-filters onclick="resetParams();">Clear all</button>
				</div>

				<div class="catalog_mo">
					<div class="catalog_filter"></div>
				</div>

				<div
					id="searchedItemDisplay"
					class="searched_item_display bo-catalog-grid tp-listing-grid"
					data-displaytype="lattice"
				></div>
			</section>
		</div>
	</div>
</main>

<div id="wish_alert">
	<div class="wa_on"></div>
	<div class="wa_off"></div>
	<div class="wa_msg"></div>
</div>

<script src="/app/javascript/js/trendypicker-listing-cards.js"></script>
<script src="/app/javascript/js/trendypicker-catalog.js?v=20260903-3"></script>
<script type="text/javascript">
$(function () {
	colorFilter_white("#searchFilterSelected .color_type");

	$("#catalog_filter").on("change", function () {
		var sort = $(this).val();
		$("#filteredItemSorting li.item_order ul.list li label input").each(function () {
			if ($(this).val() == sort) {
				$(this).click();
			}
		});
	});

	var catalogFilterSyncTimer = null;
	var catalogFilterObserver = null;
	var catalogFilterObservedNode = null;

	function isCatalogMobileTablet() {
		return window.matchMedia("(max-width: 1124px)").matches;
	}

	function selectedCatalogFilterLabel($item) {
		var $remove = $item.find("a.remove").first();
		if (!$remove.length) return "";
		return $.trim($remove.text().replace(/[×✕✖]+$/g, ""));
	}

	function normalizeCatalogFilterLabel(value) {
		return String(value || "")
			.toLowerCase()
			.replace(/^k[\s_-]*/i, "")
			.replace(/[^a-z0-9가-힣]+/g, "");
	}

	function isCurrentCatalogCategoryLabel(label) {
		var $page = $("#catalog_page");
		var currentRaw = $page.attr("data-category-title") || "";
		var currentHero = $page.find(".bo-catalog-hero-title").first().text() || "";
		var normalized = normalizeCatalogFilterLabel(label);
		if (!normalized) return false;

		return (
			normalized === normalizeCatalogFilterLabel(currentRaw) ||
			normalized === normalizeCatalogFilterLabel(currentHero)
		);
	}

	function catalogFilterChipKey($source, label) {
		var filterItem = $source.data("filteritem");
		return String(filterItem === undefined ? "" : filterItem) + "::" + normalizeCatalogFilterLabel(label);
	}

	function syncCatalogFilterChips() {
		var $wrap = $("#listingActiveFilters");
		var $chips = $("#listingChips");
		if (!$wrap.length || !$chips.length) return;

		if (!isCatalogMobileTablet()) {
			$chips.find("[data-catalog-mobile-filter-chip]").remove();
			if (!$chips.children().length) $wrap.prop("hidden", true);
			return;
		}

		var $sourceItems = $("#searchFilterSelected .selected_item_area li");
		var seen = {};

		/* Mobile/tablet owns this visual target completely. Rebuild from the
		   canonical Firstmall selected-filter list so stale/external chips cannot
		   remain beside the mirrored chips and create duplicates. */
		$chips.empty();

		$sourceItems.each(function () {
			var $source = $(this);
			var filterItem = $source.data("filteritem");
			var label = selectedCatalogFilterLabel($source);
			if (!label) return;

			/* The catalog page's current first-level category is page context,
			   not a user-selected filter, so never surface it as a removable chip. */
			if (isCurrentCatalogCategoryLabel(label)) return;

			var key = catalogFilterChipKey($source, label);
			if (seen[key]) return;
			seen[key] = true;

			var $chip = $("<button>", {
				type: "button",
				class: "bo-catalog-filter-chip",
				"data-catalog-mobile-filter-chip": "",
				"aria-label": "Remove filter " + label
			});

			if (filterItem !== undefined) {
				$chip.attr("data-filteritem", String(filterItem));
			}

			$("<span>", {
				class: "bo-catalog-filter-chip__label",
				text: label
			}).appendTo($chip);

			$("<span>", {
				class: "bo-catalog-filter-chip__remove",
				"aria-hidden": "true",
				text: "×"
			}).appendTo($chip);

			$chips.append($chip);
		});

		$wrap.prop("hidden", $chips.children().length === 0);
	}

	function scheduleCatalogFilterChipSync() {
		window.clearTimeout(catalogFilterSyncTimer);
		catalogFilterSyncTimer = window.setTimeout(syncCatalogFilterChips, 30);
	}

	function observeCatalogSelectedFilters() {
		var node = document.getElementById("searchFilterSelected");
		if (!node || !window.MutationObserver || node === catalogFilterObservedNode) return;

		if (catalogFilterObserver) catalogFilterObserver.disconnect();
		catalogFilterObservedNode = node;
		catalogFilterObserver = new MutationObserver(scheduleCatalogFilterChipSync);
		catalogFilterObserver.observe(node, {
			childList: true,
			subtree: true,
			attributes: true
		});
	}

	$(document).on("click", "#listingChips [data-catalog-mobile-filter-chip]", function () {
		var filterItem = $(this).attr("data-filteritem");
		var $sourceItems = $("#searchFilterSelected .selected_item_area li");
		var $source = $();

		if (filterItem !== undefined) {
			$source = $sourceItems.filter(function () {
				return String($(this).data("filteritem")) === filterItem;
			}).first();
		}

		if (!$source.length) {
			var chipLabel = $.trim($(this).find(".bo-catalog-filter-chip__label").text());
			$source = $sourceItems.filter(function () {
				return selectedCatalogFilterLabel($(this)) === chipLabel;
			}).first();
		}

		$source.find("a.remove").first().trigger("click");
		scheduleCatalogFilterChipSync();
	});

	$(document).on(
		"click change",
		"#catalog_page .search_filter input, #catalog_page .search_filter a, #catalog_page .fixed_bottom button, #catalog_page .selected_clear",
		function () {
			window.setTimeout(function () {
				observeCatalogSelectedFilters();
				syncCatalogFilterChips();
			}, 80);
		}
	);

	$(document).ajaxComplete(function () {
		observeCatalogSelectedFilters();
		scheduleCatalogFilterChipSync();
	});

	$(window).on("resize.catalogFilterChips", scheduleCatalogFilterChipSync);

	observeCatalogSelectedFilters();
	syncCatalogFilterChips();

	$(".category_filter_mo").on("click", function () {
		$(".search_left").addClass("on");
	});
	$("#catalog_page .filter_title a, .fixed_bottom > button").on("click", function () {
		$(".search_left").removeClass("on");
	});
	window.setTimeout(function () {
		observeCatalogSelectedFilters();
		syncCatalogFilterChips();
	}, 1000);
});
</script>
