<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++++

- 파일위치 : [스킨폴더]/mypage/mypage_lnb.html
- 이 파일이 마이페이지 LNB 의 서버 기준 정의처입니다. 메뉴 항목/주소를

  메뉴 항목을 바꿀 때는 스크립트의 immediateMypageLnbMarkup 도 맞춥니다.
  (원본 스킨의 common/mypage_ui.js 가 #subpageLNB 에
