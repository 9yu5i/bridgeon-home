<!-- ++++++++++++++++++++++++++++++++++++++++++++++++++++
@@ 나의 상품 후기 List / TrendyPicker
- 파일위치 : [스킨폴더]/mypage/mygdreview_catalog.html
- Firstmall 후기 목록 위에 카테고리/기간 필터와 편집 모달 UI 적용
++++++++++++++++++++++++++++++++++++++++++++++++++++ -->

<link rel="stylesheet" href="/data/skin/{skin}/css/redesign/trendypicker-mypage.css" />
<link rel="stylesheet" href="/data/skin/{skin}/css/redesign/trendypicker-reviews.css" />

<div class="subpage_wrap bo-mypage-shell bo-reviews-shell">

	<!-- +++++ mypage LNB ++++ -->
	<aside class="bo-account-side" data-mypage-lnb>
		<!-- 마이페이지 LNB 공통. 정의: [스킨폴더]/mypage/mypage_lnb.html -->
	</aside>
	<!-- +++++ //mypage LNB ++++ -->

	<!-- +++++ mypage contents ++++ -->
	<main class="subpage_container bo-mypage bo-reviews-page">
		<a id="subAllButton" class="btn_sub_all" href="javascript:void(0)">MENU</a>

		<div class="title_container bo-reviews-head">
			<h1><span designElement="text">My Reviews</span></h1>
		</div>

		<div id="boardlayout">
			<script type="text/javascript">
				//<![CDATA[
				var board_id = '{manager.id}';
				var boardlistsurl = '{boardurl->lists}';
				var boardwriteurl = '{boardurl->write}';
				var boardviewurl = '{boardurl->view}';
				var boardmodifyurl = '{boardurl->modify}';
				//]]>
			</script>
			<script type="text/javascript" src="/app/javascript/js/board.js?v=20200513"></script>
			<script type="text/javascript" src="/app/javascript/jquery/jquery.form.js"></script>
			<script type="text/javascript" src="/app/javascript/plugin/validate/jquery.validate.js" charset="utf-8"></script>

			<div id="bbslist">
				<form name="boardsearch" id="boardsearch" class="bo-reviews-controls">
					<input type="hidden" name="id" value="{manager.id}" />
					<input type="hidden" name="popup" value="{_GET.popup}" />
					<input type="hidden" name="iframe" value="{_GET.iframe}" />
					<input type="hidden" name="goods_seq" value="{_GET.goods_seq}" />
					<input type="hidden" name="perpage" id="perpage" value="6" />

					<label class="bo-reviews-search">
						<span class="sr-only">Search by product name</span>
						<input type="text" name="search_text" id="search_text" value="{_GET.search_text}" title="Search by product name" placeholder="Search by product name" class="res_bbs_search_input" />
						<button type="submit" aria-label="Search"></button>
					</label>

					<div class="bo-reviews-controls-selects">
						<select name="review_category" id="searchcategory" class="bo-reviews-select" aria-label="Product category">
							<option value="" {? !_GET.review_category} selected="selected"{/}>All Products</option>
							<option value="Beauty" {? _GET.review_category == 'Beauty'} selected="selected"{/}>Beauty</option>
							<option value="K-Food" {? _GET.review_category == 'K-Food'} selected="selected"{/}>K-Food</option>
							<option value="Lifestyle" {? _GET.review_category == 'Lifestyle'} selected="selected"{/}>Lifestyle</option>
							<option value="K-POP" {? _GET.review_category == 'K-POP'} selected="selected"{/}>K-POP</option>
							<option value="K-Traditional" {? _GET.review_category == 'K-Traditional'} selected="selected"{/}>K-Traditional</option>
						</select>
						<select class="bo-reviews-select bo-reviews-period" aria-label="Review period">
							<option value="0" selected="selected">All</option>
							<option value="3">Last 3 Months</option>
							<option value="6">Last 6 Months</option>
							<option value="12">Last 12 Months</option>
						</select>
					</div>
				</form>

				<!--{ ? loop }-->
				<section class="bo-reviews-list" aria-label="My review list">
					<!--{ @ loop }-->
					<article class="bo-review-card">
						<div class="bo-review-product">
							<a class="bo-review-thumb" href="/goods/view?no={.goodsInfo.goods_seq}" aria-label="View {.goodsInfo.goods_name}">
								<img src="{.goodsInfo.image}" onerror="this.src='/data/icon/error/noimage_list.gif'" alt="" />
							</a>
							<div class="bo-review-product-copy">
								<h2><a href="/goods/view?no={.goodsInfo.goods_seq}">{.goodsInfo.goods_name}</a></h2>
								<a class="bo-review-view-link" href="/goods/view?no={.goodsInfo.goods_seq}">View Product &gt;</a>
							</div>
						</div>
						<div class="bo-review-main">
							<div class="bo-review-main-top">
								<div class="bo-review-score">
									<p class="star bo-review-stars"><b style="width:{.score/5*100}%"></b></p>
									<b class="bo-review-score-num">{.score}</b>
								</div>
								<!--{? .filelist}-->
								<div class="bo-review-gallery" aria-label="Review photos">
									<img src="{.filelist.realfileurl}" alt="" />
								</div>
								<!--{/}-->
							</div>
							<div class="bo-review-copy">
								<h3>{.subject}</h3>
								<p>{=strip_tags(.contents)}</p>
							</div>
							<div class="bo-review-actions">
								<time>{=date('Y.m.d',strtotime(.date))}</time>
								<button type="button" class="bo-review-edit-btn" data-review-edit-open data-review-seq="{.seq}">View / Edit</button>
							</div>
						</div>
					</article>
					<!--{ / }-->
				</section>
				<!--{ : }-->
				<div class="bo-reviews-empty">
					<p>You haven't written any reviews yet.</p>
					<a href="/mypage/order_catalog?sc_date=0">View orders available for review</a>
				</div>
				<!--{ / }-->

				<!--{? pagin}-->
				<div id="pagingDisplay" class="paging_navigation bo-reviews-pagination">{pagin}</div>
				<!--{/}-->
			</div>
		</div>
	</main>
	<!-- +++++ //mypage contents ++++ -->

</div>

<div class="review-edit-layer" data-review-edit-layer hidden aria-hidden="true">
	<button type="button" class="review-edit-backdrop" data-review-edit-close aria-label="Close review editor"></button>
	<section class="review-edit-dialog" role="dialog" aria-modal="true" aria-labelledby="review-edit-title">
		<button type="button" class="review-edit-close" data-review-edit-close aria-label="Close review editor">&times;</button>
		<p class="review-edit-eyebrow" data-review-dialog-eyebrow>Edit Review</p>
		<h2 id="review-edit-title" data-review-dialog-title>Update your review</h2>
		<div class="review-edit-product">
			<img data-review-edit-thumb alt="" />
			<div>
				<p data-review-edit-brand></p>
				<strong data-review-edit-name></strong>
				<small data-review-edit-price></small>
			</div>
		</div>
		<div class="review-edit-rating" aria-label="Review rating">
			<button type="button" data-review-edit-rating="1" aria-label="1 star">&#9733;</button>
			<button type="button" data-review-edit-rating="2" aria-label="2 stars">&#9733;</button>
			<button type="button" data-review-edit-rating="3" aria-label="3 stars">&#9733;</button>
			<button type="button" data-review-edit-rating="4" aria-label="4 stars">&#9733;</button>
			<button type="button" data-review-edit-rating="5" aria-label="5 stars">&#9733;</button>
		</div>
		<label class="review-edit-field">
			<span>Review Title</span>
			<input type="text" data-review-edit-heading />
		</label>
		<label class="review-edit-field">
			<span>Your Review</span>
			<textarea rows="5" data-review-edit-copy></textarea>
		</label>
		<div class="review-edit-upload">
			<button type="button" data-review-edit-upload>Change Photos</button>
			<span data-review-edit-upload-status>Up to 5 photos</span>
			<input class="review-edit-file-input" type="file" accept="image/*" multiple data-review-edit-files />
		</div>
		<div class="review-edit-preview" data-review-edit-preview aria-live="polite"></div>
		<div class="review-edit-actions">
			<button type="button" class="review-edit-secondary" data-review-edit-close>Cancel</button>
			<button type="button" class="review-edit-primary" data-review-edit-save>Save Review</button>
		</div>
	</section>
</div>

<script type="text/javascript">
$(function() {
	var reviewPageUrl = new URL(window.location.href);
	if (reviewPageUrl.searchParams.get('perpage') !== '6') {
		reviewPageUrl.searchParams.set('perpage', '6');
		window.location.replace(reviewPageUrl.toString());
		return;
	}

	var pagingTotalNum = $('#pagingDisplay a').length;
	if ( pagingTotalNum < 2 ) {
		$('#pagingDisplay').hide();
	}
});
</script>
<script src="/app/javascript/js/trendypicker-mypage.js"></script>
